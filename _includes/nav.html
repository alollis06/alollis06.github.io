<header class="site-header">
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="logo">
      <span class="logo-name">{{ site.author.name }}</span>
      <span class="logo-title">{{ site.author.title }}</span>
    </a>
    <nav class="site-nav">
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}" class="nav-link">{{ item.label }}</a>
      {% endfor %}
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
